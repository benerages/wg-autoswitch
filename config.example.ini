; WG-AutoSwitch - Beispielkonfiguration
; Ablage: %ProgramData%\WgAutoSwitch\config.ini  (legt "wgas install" automatisch an)
; Kodierung: UTF-16 LE, sobald eine SSID Umlaute enthaelt (Editor: Speichern unter > Codierung).
; Nach Aenderungen: wgas reload   (Eingabeaufforderung als Administrator)

[general]
default_tunnel = wg-home      ; Tunnel fuer alle unbekannten Netze (und Fail-safe)
debounce_ms = 2500            ; Ruhezeit nach dem letzten Netzereignis
no_network = off              ; off = ohne Netz Tunnel aus (spart Akku)
captive_portal = wait         ; wait = Tunnel erst nach Hotel-/Zug-Anmeldung

; Regeln: Die erste passende Regel gewinnt; alle angegebenen Merkmale muessen passen.
; tunnel = none (kein Tunnel) verlangt gateway_mac UND dns_suffix, ssid oder bssid.
; Einfacher: Oberflaeche wgas-gui.exe, Reiter Auto-Tunneling.
; Werte fuer das aktuelle Netz liefert: wgas check

[network.home-lan]
type = ethernet
gateway_mac = 00:11:22:33:44:55
dns_suffix = home.lan
tunnel = none

[network.home-wlan]
type = wifi
ssid = MeinWLAN
;bssid = 10:20:30:40:50:60   ; optional: nur dieser Access Point
gateway_mac = 00:11:22:33:44:55
tunnel = none

; Im Buero einen anderen Tunnel verwenden (z. B. nur zum Heimnetz statt Volltunnel)
[network.buero]
gateway_mac = aa:bb:cc:dd:ee:ff
dns_suffix = firma.example
tunnel = wg-split

; Handy-Hotspot: bewusst den Volltunnel
[network.handy]
type = wifi
ssid = Mein iPhone
tunnel = wg-home
